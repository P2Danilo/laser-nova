<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Láser Nova — Pedidos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Mulish:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0d0d0f; --surface: #16161a; --surface2: #1e1e24;
  --border: rgba(255,255,255,0.07); --text: #f0eff4;
  --muted: rgba(240,239,244,0.45); --accent: #e8622a; --accent2: #f0a050;
  --pending: #4a9eff; --process: #f0a050; --ready: #a78bfa;
  --delivered: #34d399; --cancelled: #f87171; --radius: 12px;
}
body { font-family: 'Mulish', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

/* LOADER */
#loader {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 999; gap: 16px; transition: opacity 0.4s;
}
#loader.hide { opacity: 0; pointer-events: none; }
.loader-logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 28px; }
.loader-logo span { color: var(--accent); }
.loader-bar { width: 160px; height: 2px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.loader-bar::after {
  content: ''; display: block; width: 40%; height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 2px; animation: loading 1.2s ease-in-out infinite;
}
@keyframes loading { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
.loader-text { font-size: 12px; color: var(--muted); letter-spacing: 1px; }

/* LOGIN */
#login-screen {
  position: fixed; inset: 0; background: var(--bg);
  display: none; flex-direction: column; align-items: center; justify-content: center;
  z-index: 500; gap: 0;
}
#login-screen.show { display: flex; }

.login-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 48px 40px;
  width: 100%;
  max-width: 380px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}

.login-icon {
  width: 64px; height: 64px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
  margin-bottom: 20px;
}

.login-title {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 26px;
  margin-bottom: 6px;
}

.login-title span { color: var(--accent); }

.login-sub {
  font-size: 14px;
  color: var(--muted);
  font-weight: 300;
  margin-bottom: 36px;
  line-height: 1.5;
}

.btn-google {
  width: 100%;
  background: white;
  color: #1a1a1a;
  border: none;
  padding: 14px 20px;
  border-radius: 10px;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: opacity 0.2s, transform 0.15s;
}

.btn-google:hover { opacity: 0.92; transform: translateY(-1px); }
.btn-google:active { transform: translateY(0); }

.google-icon {
  width: 20px; height: 20px;
  flex-shrink: 0;
}

.login-footer {
  margin-top: 20px;
  font-size: 11px;
  color: var(--muted);
  opacity: 0.6;
}

/* HEADER */
#app { display: none; }
#app.show { display: block; }

header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 24px; display: flex; align-items: center; justify-content: space-between;
  height: 64px; position: sticky; top: 0; z-index: 200;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.logo-text { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: -0.5px; }
.logo-text span { color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 10px; }

.user-pill {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface2); border: 1px solid var(--border);
  padding: 5px 12px 5px 6px; border-radius: 100px;
  font-size: 12px; color: var(--muted);
}
.user-avatar {
  width: 24px; height: 24px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: white; overflow: hidden;
  flex-shrink: 0;
}
.user-avatar img { width: 100%; height: 100%; object-fit: cover; }

.sync-indicator {
  display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted);
  background: var(--surface2); border: 1px solid var(--border); padding: 5px 12px; border-radius: 100px;
}
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: #34d399; animation: pulse 2s infinite; }
.sync-dot.offline { background: var(--cancelled); animation: none; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

.stats-pill {
  background: var(--surface2); border: 1px solid var(--border); padding: 5px 12px;
  border-radius: 100px; font-size: 12px; font-weight: 600; color: var(--muted);
  display: flex; align-items: center; gap: 6px;
}
.stats-pill strong { color: var(--accent2); }

.btn-new {
  background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; border: none;
  padding: 8px 18px; border-radius: 8px; font-family: 'Syne', sans-serif; font-weight: 700;
  font-size: 13px; cursor: pointer; transition: opacity 0.2s, transform 0.15s;
}
.btn-new:hover { opacity: 0.88; transform: translateY(-1px); }

.btn-logout {
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  padding: 6px 12px; border-radius: 8px; font-family: 'Mulish', sans-serif;
  font-size: 12px; cursor: pointer; transition: all 0.2s;
}
.btn-logout:hover { border-color: var(--cancelled); color: var(--cancelled); }

/* KANBAN */
.kanban-wrapper { padding: 24px; overflow-x: auto; min-height: calc(100vh - 64px); }
.kanban { display: flex; gap: 16px; min-width: max-content; align-items: flex-start; }
.column {
  width: 280px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; flex-shrink: 0;
}
.col-header {
  padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.col-title { display: flex; align-items: center; gap: 8px; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 13px; }
.col-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.col-count { background: var(--surface2); color: var(--muted); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 100px; font-family: 'Syne', sans-serif; }
.col-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 100px; }

/* CARD */
.card {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px; cursor: pointer; position: relative;
  transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
  animation: cardIn 0.25s ease both;
}
@keyframes cardIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.card:hover { border-color: rgba(255,255,255,0.15); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.card-client { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px; line-height: 1.2; }
.card-type { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 3px 8px; border-radius: 100px; white-space: nowrap; flex-shrink: 0; }
.card-desc { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-footer { display: flex; align-items: center; justify-content: space-between; }
.card-price { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 15px; color: var(--accent2); }
.card-date { font-size: 11px; color: var(--muted); }
.card-date.urgent { color: #f87171; }
.card-phone { font-size: 11px; color: var(--muted); margin-top: 6px; }
.card-actions { position: absolute; top: 10px; right: 10px; display: none; gap: 4px; }
.card:hover .card-actions { display: flex; }
.btn-icon {
  background: var(--surface); border: 1px solid var(--border); color: var(--muted);
  width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center;
  justify-content: center; cursor: pointer; font-size: 12px; transition: all 0.15s;
}
.btn-icon:hover { background: var(--accent); color: white; border-color: var(--accent); }
.btn-icon.del:hover { background: #f87171; border-color: #f87171; }
.type-grabado { background: rgba(74,158,255,0.15); color: #4a9eff; }
.type-sublimacion { background: rgba(167,139,250,0.15); color: #a78bfa; }
.type-dtf { background: rgba(240,160,80,0.15); color: var(--accent2); }
.type-digital { background: rgba(52,211,153,0.15); color: #34d399; }
.type-otro { background: rgba(240,239,244,0.1); color: var(--muted); }

/* MODAL */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px);
  z-index: 300; display: flex; align-items: center; justify-content: center; padding: 20px;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.overlay.active { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  width: 100%; max-width: 480px; padding: 28px;
  transform: translateY(16px); transition: transform 0.25s;
  max-height: 90vh; overflow-y: auto;
}
.overlay.active .modal { transform: translateY(0); }
.modal-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 20px; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }
.modal-title span { color: var(--accent); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group.full { grid-column: 1 / -1; }
label { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
input, select, textarea {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  padding: 10px 12px; border-radius: 8px; font-family: 'Mulish', sans-serif;
  font-size: 14px; transition: border-color 0.2s; outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
select option { background: var(--surface2); }
textarea { resize: vertical; min-height: 80px; }
.modal-footer { display: flex; gap: 10px; margin-top: 24px; justify-content: flex-end; }
.btn-cancel {
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  padding: 10px 20px; border-radius: 8px; font-family: 'Syne', sans-serif;
  font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s;
}
.btn-cancel:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
.btn-save {
  background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; color: white;
  padding: 10px 24px; border-radius: 8px; font-family: 'Syne', sans-serif;
  font-weight: 700; font-size: 13px; cursor: pointer; transition: opacity 0.2s;
}
.btn-save:hover { opacity: 0.88; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); font-size: 12px; }
.empty-icon { font-size: 28px; margin-bottom: 8px; }
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

@media (max-width: 600px) {
  header { padding: 0 14px; }
  .logo-text { font-size: 15px; }
  .stats-pill, .sync-indicator { display: none; }
  .kanban-wrapper { padding: 12px; }
  .column { width: 255px; }
  .form-grid { grid-template-columns: 1fr; }
  .login-box { padding: 36px 24px; }
}
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div class="loader-logo">Láser <span>Nova</span></div>
  <div class="loader-bar"></div>
  <div class="loader-text">Iniciando...</div>
</div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-icon">🔥</div>
    <div class="login-title">Láser <span>Nova</span></div>
    <div class="login-sub">Gestión de pedidos<br>Inicia sesión para continuar</div>
    <button class="btn-google" onclick="loginGoogle()">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Entrar con Google
    </button>
    <div class="login-footer">Solo tú tienes acceso a esta app</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="logo">
      <div class="logo-icon">🔥</div>
      <div class="logo-text">Láser <span>Nova</span></div>
    </div>
    <div class="header-right">
      <div class="sync-indicator">
        <div class="sync-dot" id="sync-dot"></div>
        <span id="sync-text">En línea</span>
      </div>
      <div class="stats-pill">Pendientes: <strong id="count-pending">0</strong></div>
      <div class="user-pill">
        <div class="user-avatar" id="user-avatar"></div>
        <span id="user-name">Usuario</span>
      </div>
      <button class="btn-new" onclick="openModal()">+ Nuevo pedido</button>
      <button class="btn-logout" onclick="logoutUser()">Salir</button>
    </div>
  </header>

  <div class="kanban-wrapper">
    <div class="kanban">
      <div class="column">
        <div class="col-header">
          <div class="col-title"><div class="col-dot" style="background:var(--pending)"></div>Pendiente</div>
          <div class="col-count" id="cnt-pendiente">0</div>
        </div>
        <div class="col-body" id="body-pendiente"></div>
      </div>
      <div class="column">
        <div class="col-header">
          <div class="col-title"><div class="col-dot" style="background:var(--process)"></div>En proceso</div>
          <div class="col-count" id="cnt-proceso">0</div>
        </div>
        <div class="col-body" id="body-proceso"></div>
      </div>
      <div class="column">
        <div class="col-header">
          <div class="col-title"><div class="col-dot" style="background:var(--ready)"></div>Listo para entregar</div>
          <div class="col-count" id="cnt-listo">0</div>
        </div>
        <div class="col-body" id="body-listo"></div>
      </div>
      <div class="column">
        <div class="col-header">
          <div class="col-title"><div class="col-dot" style="background:var(--delivered)"></div>Entregado</div>
          <div class="col-count" id="cnt-entregado">0</div>
        </div>
        <div class="col-body" id="body-entregado"></div>
      </div>
      <div class="column">
        <div class="col-header">
          <div class="col-title"><div class="col-dot" style="background:var(--cancelled)"></div>Cancelado</div>
          <div class="col-count" id="cnt-cancelado">0</div>
        </div>
        <div class="col-body" id="body-cancelado"></div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="closeIfOutside(event)">
  <div class="modal">
    <div class="modal-title"><span>✦</span><span id="modal-heading">Nuevo pedido</span></div>
    <div class="form-grid">
      <div class="form-group">
        <label>Cliente</label>
        <input type="text" id="f-client" placeholder="Nombre completo">
      </div>
      <div class="form-group">
        <label>Teléfono</label>
        <input type="tel" id="f-phone" placeholder="3XX XXX XXXX">
      </div>
      <div class="form-group">
        <label>Tipo de trabajo</label>
        <select id="f-type">
          <option value="grabado">Grabado láser</option>
          <option value="sublimacion">Sublimación</option>
          <option value="dtf">DTF</option>
          <option value="digital">Impresión digital</option>
          <option value="otro">Otro</option>
        </select>
      </div>
      <div class="form-group">
        <label>Precio ($)</label>
        <input type="number" id="f-price" placeholder="0">
      </div>
      <div class="form-group full">
        <label>Descripción del pedido</label>
        <textarea id="f-desc" placeholder="Materiales, medidas, cantidad, diseño..."></textarea>
      </div>
      <div class="form-group">
        <label>Fecha de entrega</label>
        <input type="date" id="f-date">
      </div>
      <div class="form-group">
        <label>Estado</label>
        <select id="f-status">
          <option value="pendiente">Pendiente</option>
          <option value="proceso">En proceso</option>
          <option value="listo">Listo para entregar</option>
          <option value="entregado">Entregado</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveOrder()">Guardar pedido</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, onValue, set, remove, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAPCmkt1BBpsU1jVov38zAtVu3qs2v0BL8",
  authDomain: "laser-nova.firebaseapp.com",
  databaseURL: "https://laser-nova-default-rtdb.firebaseio.com",
  projectId: "laser-nova",
  storageBucket: "laser-nova.firebasestorage.app",
  messagingSenderId: "67946647140",
  appId: "1:67946647140:web:4d9e5d1e692b98ab3a9971"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const provider = new GoogleAuthProvider();

const typeLabels = { grabado:'Grabado', sublimacion:'Sublimación', dtf:'DTF', digital:'Digital', otro:'Otro' };
let orders = {};
let editingId = null;
let dbListener = null;

// Sync indicator
window.addEventListener('online', () => { document.getElementById('sync-dot').classList.remove('offline'); document.getElementById('sync-text').textContent = 'En línea'; });
window.addEventListener('offline', () => { document.getElementById('sync-dot').classList.add('offline'); document.getElementById('sync-text').textContent = 'Sin conexión'; });

// Auth state
onAuthStateChanged(auth, (user) => {
  document.getElementById('loader').classList.add('hide');
  if (user) {
    showApp(user);
  } else {
    showLogin();
  }
});

function showLogin() {
  document.getElementById('login-screen').classList.add('show');
  document.getElementById('app').classList.remove('show');
  if (dbListener) { dbListener(); dbListener = null; }
}

function showApp(user) {
  document.getElementById('login-screen').classList.remove('show');
  document.getElementById('app').classList.add('show');

  // User info
  const nameEl = document.getElementById('user-name');
  const avatarEl = document.getElementById('user-avatar');
  const firstName = user.displayName ? user.displayName.split(' ')[0] : 'Usuario';
  nameEl.textContent = firstName;
  if (user.photoURL) {
    avatarEl.innerHTML = `<img src="${user.photoURL}" alt="${firstName}">`;
  } else {
    avatarEl.textContent = firstName.charAt(0).toUpperCase();
  }

  // Load data
  const pedidosRef = ref(db, 'pedidos');
  dbListener = onValue(pedidosRef, (snap) => {
    orders = snap.val() || {};
    renderAll();
  });
}

window.loginGoogle = async () => {
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    alert('Error al iniciar sesión. Intenta de nuevo.');
    console.error(e);
  }
};

window.logoutUser = async () => {
  if (!confirm('¿Cerrar sesión?')) return;
  await signOut(auth);
};

function formatDate(d) { if (!d) return ''; const [y,m,dd] = d.split('-'); return `${dd}/${m}/${y}`; }
function formatPrice(v) { if (!v) return '—'; return '$' + Number(v).toLocaleString('es-CO'); }
function isUrgent(d) { if (!d) return false; const diff = (new Date(d) - new Date()) / 86400000; return diff <= 2 && diff >= 0; }
function isPast(d, col) { if (!d) return false; return new Date(d) < new Date() && col !== 'entregado' && col !== 'cancelado'; }

function renderAll() {
  const cols = ['pendiente','proceso','listo','entregado','cancelado'];
  cols.forEach(c => {
    document.getElementById('body-' + c).innerHTML = '';
    document.getElementById('cnt-' + c).textContent = '0';
  });
  let pendingCount = 0;
  const list = Object.entries(orders).sort((a,b) => (b[1].createdAt||0) - (a[1].createdAt||0));
  list.forEach(([id, o]) => {
    const col = o.status || 'pendiente';
    const body = document.getElementById('body-' + col);
    if (!body) return;
    const cnt = document.getElementById('cnt-' + col);
    cnt.textContent = parseInt(cnt.textContent) + 1;
    if (col === 'pendiente') pendingCount++;
    const urgent = isUrgent(o.date);
    const past = isPast(o.date, col);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-actions">
        <button class="btn-icon" onclick="window._edit('${id}',event)">✎</button>
        <button class="btn-icon del" onclick="window._del('${id}',event)">✕</button>
      </div>
      <div class="card-top">
        <div class="card-client">${o.client||'Sin nombre'}</div>
        <div class="card-type type-${o.type}">${typeLabels[o.type]||'Otro'}</div>
      </div>
      ${o.desc ? `<div class="card-desc">${o.desc}</div>` : ''}
      <div class="card-footer">
        <div class="card-price">${formatPrice(o.price)}</div>
        ${o.date ? `<div class="card-date ${urgent||past?'urgent':''}">📅 ${formatDate(o.date)}${urgent?' ⚡':past?' ⚠️':''}</div>` : ''}
      </div>
      ${o.phone ? `<div class="card-phone">📱 ${o.phone}</div>` : ''}
    `;
    card.addEventListener('click', () => window._edit(id));
    body.appendChild(card);
  });
  document.getElementById('count-pending').textContent = pendingCount;
  cols.forEach(c => {
    const body = document.getElementById('body-' + c);
    if (body.children.length === 0) body.innerHTML = `<div class="empty"><div class="empty-icon">○</div>Sin pedidos</div>`;
  });
}

window.openModal = () => {
  editingId = null;
  document.getElementById('modal-heading').textContent = 'Nuevo pedido';
  ['f-client','f-phone','f-price','f-desc','f-date'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-type').value = 'grabado';
  document.getElementById('f-status').value = 'pendiente';
  document.getElementById('overlay').classList.add('active');
};

window._edit = (id, e) => {
  if (e) e.stopPropagation();
  editingId = id;
  const o = orders[id]; if (!o) return;
  document.getElementById('modal-heading').textContent = 'Editar pedido';
  document.getElementById('f-client').value = o.client || '';
  document.getElementById('f-phone').value = o.phone || '';
  document.getElementById('f-type').value = o.type || 'grabado';
  document.getElementById('f-price').value = o.price || '';
  document.getElementById('f-desc').value = o.desc || '';
  document.getElementById('f-date').value = o.date || '';
  document.getElementById('f-status').value = o.status || 'pendiente';
  document.getElementById('overlay').classList.add('active');
};

window._del = (id, e) => {
  if (e) e.stopPropagation();
  if (!confirm('¿Eliminar este pedido?')) return;
  remove(ref(db, 'pedidos/' + id));
};

window.closeModal = () => { document.getElementById('overlay').classList.remove('active'); editingId = null; };
window.closeIfOutside = (e) => { if (e.target === document.getElementById('overlay')) window.closeModal(); };

window.saveOrder = () => {
  const client = document.getElementById('f-client').value.trim();
  if (!client) { document.getElementById('f-client').focus(); return; }
  const order = {
    client, phone: document.getElementById('f-phone').value.trim(),
    type: document.getElementById('f-type').value,
    price: document.getElementById('f-price').value,
    desc: document.getElementById('f-desc').value.trim(),
    date: document.getElementById('f-date').value,
    status: document.getElementById('f-status').value,
    createdAt: editingId ? (orders[editingId]?.createdAt || Date.now()) : Date.now()
  };
  const pedidosRef = ref(db, 'pedidos');
  if (editingId) { set(ref(db, 'pedidos/' + editingId), order); }
  else { push(pedidosRef, order); }
  window.closeModal();
};

document.addEventListener('keydown', e => { if (e.key === 'Escape') window.closeModal(); });
</script>
</body>
</html>
